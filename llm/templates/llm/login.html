<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso al asistente IA</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,sans-serif; background:#eef2f0; color:#17362d }
    form { width:min(360px,calc(100vw - 40px)); padding:32px; border-radius:18px; background:white; box-shadow:0 18px 50px #17362d20 }
    h1 { margin-top:0 } label { display:block; margin:16px 0 6px } input { width:100%; padding:12px; border:1px solid #ccd7d2; border-radius:8px }
    button { width:100%; margin-top:20px; border:0; border-radius:8px; padding:13px; background:#225c4c; color:white; font-weight:700 }
    .error { color:#9a3d35 }
  </style>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>Asistente de inventario</h1>
    {% if form.errors %}<p class="error">Usuario o contraseña incorrectos.</p>{% endif %}
    <label for="id_username">Usuario</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus>
    <label for="id_password">Contraseña</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Ingresar</button>
  </form>
</body>
</html>
