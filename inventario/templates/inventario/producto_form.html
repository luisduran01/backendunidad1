{% extends 'inventario/base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ accion }} - Mi Tienda POS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5 mb-4" style="border-radius: 24px;">
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <div style="width: 50px; height: 50px; background: var(--gradient-primary); color: #FFFFFF; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: var(--shadow-glow-blue);">
                    <i class="bi bi-box-seam-fill"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-0 text-dark" style="font-size: 1.65rem;">{{ accion }}</h2>
                    <p class="text-muted small mb-0">Gestión de catálogo, precios y stock disponible.</p>
                </div>
            </div>

            <form method="POST" novalidate>
                {% csrf_token %}
                
                {{ form|crispy }}

                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                    <a href="{% url 'producto_list' %}" class="btn btn-light px-4 fw-semibold text-secondary" style="border-radius: 12px; height: 44px; border: 1px solid #E2E8F0;">
                        <i class="bi bi-arrow-left me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-action-primary" style="height: 44px;">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>Guardar Producto</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
